[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "decameron-whisper-tools"
version = "0.2.0"
description = "Transcribe audio with Whisper and export the transcript as a PDF in paragraphs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VBalaguera" }]
dependencies = [
    "openai-whisper>=20240930",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pypdf>=5.0", "httpx2>=2.14", "decameron-whisper-tools[web]"]

[project.scripts]
decameron-transcribe = "decameron.transcribe:main"
decameron-web = "decameron.server:main"

[project.urls]
Repository = "https://github.com/VBalaguera/decameron-whisper-tools"

[tool.hatch.build.targets.wheel]
packages = ["src/decameron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
